{% extends "admin/base.html" %}{% block title %}Пароль — ZKS95 Admin{% endblock %}{% block content %}<div class="admin-title"><div><p class="eyebrow">Security</p><h1>Изменить <em>пароль.</em></h1></div></div>{% if force %}<div class="flash flash-error">Временный пароль admin/admin нужно заменить перед использованием панели.</div>{% endif %}<form class="admin-card narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Текущий пароль<input type="password" name="current_password" autocomplete="current-password" required></label><label>Новый пароль<input type="password" name="new_password" minlength="12" autocomplete="new-password" required><small>Минимум 12 символов.</small></label><label>Повторите пароль<input type="password" name="repeat_password" minlength="12" autocomplete="new-password" required></label><button class="button button-gold" type="submit">Сохранить пароль</button></form>{% endblock %}
