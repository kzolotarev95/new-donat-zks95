<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#07080a"><link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"><title>{% block title %}Admin — ZKS95{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">{% block head %}{% endblock %}</head><body class="admin-body"><header class="admin-header"><a class="brand" href="{{ url_for('admin.dashboard') }}"><span class="brand-mark">Z</span><span>ZKS95<span class="brand-muted">/ADMIN</span></span></a>{% if admin_username %}<nav class="admin-nav"><a href="{{ url_for('admin.dashboard') }}">Обзор</a><a href="{{ url_for('admin.payments') }}">Платежи</a><a href="{{ url_for('admin.donors') }}">Донатеры</a><a href="{{ url_for('admin.settings') }}">Настройки</a><a href="{{ url_for('admin.account') }}">Аккаунт</a><form method="post" action="{{ url_for('admin.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Выйти</button></form></nav>{% endif %}</header><main class="admin-main">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
