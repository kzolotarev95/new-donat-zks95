{% extends "admin/base.html" %}{% block title %}Аккаунт — ZKS95 Admin{% endblock %}{% block content %}<div class="admin-title"><div><p class="eyebrow">Account security</p><h1>Мой <em>аккаунт.</em></h1></div></div><form class="admin-card narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Новый логин<input name="username" value="{{ user.username }}" autocomplete="username" required><small>3–64 символа: латиница, цифры, точка, дефис или _.</small></label><label>Текущий пароль<input type="password" name="current_password" autocomplete="current-password" required></label><label>Новый пароль <span class="optional">необязательно</span><input type="password" name="new_password" minlength="6" autocomplete="new-password"><small>Оставьте пустым, если меняете только логин. Минимум 6 символов.</small></label><label>Повторите новый пароль<input type="password" name="repeat_password" minlength="6" autocomplete="new-password"></label><button class="button button-gold" type="submit">Сохранить изменения</button></form>{% endblock %}
