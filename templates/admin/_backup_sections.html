<section class="settings-backup settings-section"><div class="settings-section-heading"><p class="eyebrow">Export / Restore</p><h2>Бэкап и перенос</h2><span class="muted">Перенос между VPS</span></div><div class="backup-grid"><div class="backup-card"><p class="eyebrow">01 / Донатеры</p><h3>Список донатеров</h3><p class="muted">Цвета, суммы, ссылки и закрепление в одном JSON-файле.</p><div class="backup-actions"><a class="button button-gold" href="{{ url_for('admin.backup_download', kind='donors') }}">Скачать список</a><form method="post" action="{{ url_for('admin.backup_import') }}" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="file" name="backup_file" accept="application/json,.json" required><label class="backup-check"><input type="checkbox" name="replace_donors" value="1"> Заменить текущий список</label><button class="button button-ghost" type="submit">Загрузить список</button></form></div></div><div class="backup-card"><p class="eyebrow">02 / Полный архив</p><h3>Настройки и данные</h3><p class="muted">Настройки, платежи, донатеры и push-подписки. Архив содержит секреты.</p><div class="backup-actions"><a class="button button-gold" href="{{ url_for('admin.backup_download', kind='full') }}">Скачать полный бэкап</a><form method="post" action="{{ url_for('admin.backup_import') }}" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="file" name="backup_file" accept="application/json,.json" required><label class="backup-check"><input type="checkbox" name="confirm_full" value="1" required> Заменить текущие данные</label><button class="button button-ghost" type="submit">Восстановить полный бэкап</button></form></div></div></div></section>
