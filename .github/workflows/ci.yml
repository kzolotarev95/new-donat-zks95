name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app run.py wsgi.py
      - run: pytest -q
      - run: bash -n install.sh update.sh uninstall.sh run.sh scripts/reconcile_nginx.sh scripts/remove_nginx.sh vps/*.sh
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./
          severity: warning
          version: v0.11.0

  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate package build
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m compileall -q app
