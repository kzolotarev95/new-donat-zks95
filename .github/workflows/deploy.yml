name: Deploy (manual opt-in)

# This workflow is intentionally disabled until VPS_HOST, VPS_USER and VPS_SSH_KEY
# are configured. Remove the `if: false` guard only after reviewing the host.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo /opt/new-donat-zks95/update.sh
